services:
  - type: web
    name: invoice-erp
    runtime: python
    buildCommand: pip install -r web/requirements.txt
    startCommand: gunicorn --chdir web --workers 2 --threads 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-postgres
          property: connectionString
      - key: DATABASE_ENGINE
        value: postgresql

databases:
  - name: invoice-postgres
    plan: free
